name: claimly
description: "Claimly: Automated Warranty & Refund Claim Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.18.3
  go_router: ^14.8.1
  shared_preferences: ^2.5.5
  fl_chart: ^0.68.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  mocktail: ^1.0.5
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.4

dependency_overrides:
  archive: ^4.0.10

flutter:
  uses-material-design: true
